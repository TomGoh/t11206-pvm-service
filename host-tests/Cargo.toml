[package]
name = "xkernel-vm-service-host-tests"
version = "0.1.0"
edition = "2021"
publish = false

# Runs the unit tests of the service modules that do not need Android (the lifecycle machine,
# the instance config, the reclaim check, the console and the controller with a fake AVF) on a
# development host: `cargo test` in this directory. The Android build compiles the same files from
# ../src/main.rs.

[dependencies]
anyhow = "1"
libc = "0.2"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[package]
name = "xkernel-vm-service-host-tests"
version = "0.1.0"
edition = "2021"
publish = false

# Runs the unit tests of the service modules that do not need Android (the lifecycle machine,
# the instance config, the reclaim check, the console, the controller with a fake AVF, the direct
# backend with a fake crosvm, the on-demand driver load and the driver loader's logic) on a
# development host: `cargo test` in this directory. The Android build compiles the same files from
# ../src/main.rs and ../loader/main.rs. The crosvm launcher is built as is (tests/launcher.rs).

[[bin]]
name = "xkernel_crosvm_launcher"
path = "../launcher/main.rs"

[dependencies]
anyhow = "1"
libc = "0.2"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
